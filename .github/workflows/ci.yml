name: CI
on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install pnpm
        run: npm i -g pnpm
      - name: Install
        run: pnpm install
      - name: Lint
        run: pnpm -w -r run lint || true
      - name: Build web
        run: pnpm --filter @zimtrades/web build
      - name: Build api
        run: pnpm --filter @zimtrades/api build
